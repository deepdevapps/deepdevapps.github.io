<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RX3R5VXH2S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-RX3R5VXH2S');
    </script>

    <!-- AUTOMATIC REDIRECT META FALLBACK (2 Seconds) -->
    <!-- Replace "https://yourdomain.com/target-page" with your target URL -->
    <meta http-equiv="refresh" content="2;url=https://yourdomain.com/target-page">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | DeepSquad</title>
    <link rel="shortcut icon" href="Images/logotype.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <script src="cookie-banner.js" defer></script>
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5649C0;
            --light: #F5F6FA;
            --dark: #2D3436;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        .redirect-container {
            max-width: 600px;
            padding: 40px;
        }
        
        .redirect-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
        }
        
        .redirect-text {
            font-size: 18px;
            color: var(--dark);
            opacity: 0.8;
            margin-bottom: 25px;
        }

        /* Smooth CSS Loading Spinner */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(108, 92, 231, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            margin: 0 auto 25px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--primary);
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="redirect-container animate__animated animate__fadeIn">
        <div class="spinner"></div>
        <h1 class="redirect-title">Please Wait...</h1>
        <p class="redirect-text">
            Redirecting you automatically in <strong id="countdown">2</strong> seconds.
        </p>
        <!-- Manual Link in case Javascript or Meta Refresh is disabled -->
        <a id="redirect-link" href="https://yourdomain.com/target-page" class="btn">Click here if not redirected</a>
    </div>

    <script>
        // Set your target URL here
        const TARGET_URL = "https://play.google.com/store/apps/details?id=com.DeepSquad.BankSimulator";
        let secondsLeft = 2;

        const countdownElement = document.getElementById('countdown');
        const redirectLink = document.getElementById('redirect-link');

        // Ensure link is up to date
        redirectLink.href = TARGET_URL;

        // Countdown timer interval
        const timer = setInterval(() => {
            secondsLeft--;
            countdownElement.textContent = secondsLeft;

            if (secondsLeft <= 0) {
                clearInterval(timer);
                window.location.href = TARGET_URL;
            }
        }, 1000);
    </script>
</body>
</html>
