<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Access denied | DeepSquad</title> 
<link rel="shortcut icon" href="Images/logotype.png" /> 

<link rel="preconnect" href="https://fonts.googleapis.com"> 
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet"> 

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/> 

<style> 
:root { 
--primary: #E74C3C; /* Changed color to red to indicate ban */
--primary-dark: #C0392B;
--light: #F5F6FA;
--dark: #2D3436;
}

body {
font-family: 'Poppins', sans-serif;
background-color: var(--light);
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
text-align: center;
}

.error-container {
max-width: 600px;
padding: 40px;
}

.error-code {
font-family: 'Montserrat', sans-serif;
font-size: 120px;
font-weight: 800; 
color: var(--primary); 
line-height: 1; 
margin-bottom: 20px; 
} 

.error-title { 
font-size: 36px; 
color: var(--dark); 
margin-bottom: 20px; 
} 

.error-text { 
font-size: 18px; 
margin-bottom: 30px; 
color: var(--dark); 
opacity: 0.8; 
} 

.btn { 
display: inline-block; 
padding: 15px 30px; 
background-color: var(--primary); 
color: white; 
border-radius: 50px; 
text-decoration: none; 
font-weight: 600; 
transition: all 0.3s ease; 
box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); 
} 

.btn:hover { 
background-color: var(--primary-dark); 
transform: translateY(-3px); 
box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2); 
} 

@media (max-width: 768px) { 
.error-code { 
font-size: 80px; 
} 

.error-title { 
font-size: 28px; 
} 
} 

@media (max-width: 576px) { 
.error-code { 
font-size: 60px; 
}

.error-title {
font-size: 24px;
}

.error-text {
font-size: 16px;
}

.btn {
padding: 12px 25px;
}
}
</style>
</head>
<body>
<div class="error-container animate__animated animate__fadeIn">
<div class="error-code animate__animated animate__bounceIn">403</div>
<h2 class="error-title animate__animated animate__fadeInUp">Access Denied</h2>
<p class="error-text animate__animated animate__fadeInUp animate-delay-1">
You do not have permission to view this page. Please contact the administrator if you believe this is an error.
</p>
<a href="index.html" class="btn animate__animated animate__fadeInUp animate-delay-2">Back to Home</a>
</div>
</body>
</html>
